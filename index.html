<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncy Ball - Chrome Extension</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #f8f9fa;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .logo {
      width: 140px;
      height: 140px;
      margin-bottom: 30px;
      animation: float 3s ease-in-out infinite;
      filter: drop-shadow(0 10px 30px rgba(255, 107, 107, 0.3));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ff6b6b;
    }

    .tagline {
      font-size: 1.3rem;
      color: #666;
      margin-bottom: 40px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
      color: white;
      padding: 18px 40px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 25px rgba(255, 107, 107, 0.4);
    }

    .cta-button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 35px rgba(255, 107, 107, 0.5);
    }

    .cta-button:active {
      transform: translateY(-1px) scale(0.98);
    }

    .cta-button svg {
      width: 26px;
      height: 26px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      border-top: 1px solid #e0e0e0;
    }

    footer .footer-content {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    footer a {
      color: #999;
      text-decoration: none;
      transition: color 0.2s;
    }

    footer a:hover {
      color: #333;
    }

    footer a.name-link {
      text-decoration: underline;
    }

    footer .divider {
      color: #ddd;
    }

    footer svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #121212;
        color: #fff;
      }

      .tagline {
        color: #a0a0a0;
      }

      footer {
        color: #666;
        border-top-color: rgba(255, 255, 255, 0.1);
      }

      footer a {
        color: #666;
      }

      footer a:hover {
        color: #fff;
      }

      footer .divider {
        color: rgba(255, 255, 255, 0.1);
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <img src="icon.svg" alt="Bouncy Ball" class="logo">
    <h1>Bouncy Ball</h1>
    <p class="tagline">A fun bouncy ball that lives on every page</p>
    <a href="https://chromewebstore.google.com/detail/bouncy-ball/mpfpnliaabmmkllkpkihpjagiegfjkop" class="cta-button">
